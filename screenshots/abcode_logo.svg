  <path d="M420,228 L478,228 Q555,228 555,322 Q555,420 478,420 L420,420" fill="none" stroke="url(#g1)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 分隔线 -->
  <line x1="100" y1="455" x2="580" y2="455" stroke="url(#g1)" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <!-- code -->
  <text x="340" y="500" text-anchor="middle" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="58" font-weight="400" fill="url(#g1)" letter-spacing="14" opacity="0.65">code</text>
  <!-- 装饰圆点 -->
  <circle cx="95" cy="65" r="6" fill="#7c3aed" opacity="0.45"/>
  <circle cx="118" cy="65" r="6" fill="#3b82f6" opacity="0.45"/>
  <circle cx="141" cy="65" r="6" fill="#06b6d4" opacity="0.45"/>
</svg>