name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 构建 Mac .app + DMG
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/ABcode-mac-*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-zip
          path: dist/ABcode-mac-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf desktop-file-utils \
            fuse libfuse2 squashfs-tools
      - name: 创建虚拟环境并安装依赖
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r backend/requirements.txt
          pip install pyinstaller
      - name: PyInstaller 打包 Linux
        run: |
          source .venv/bin/activate
          pyinstaller \
            --onefile \
            --name ABcode \
            --add-data "frontend:frontend" \
            --add-data "backend:backend" \
            --add-data "backend/requirements.txt:." \
            --hidden-import=uvicorn \
            --hidden-import=fastapi \
            --hidden-import=sqlite3 \
            --hidden-import=websockets \
            --hidden-import=httpx \
            --hidden-import=workflow_mod \
            backend/main.py
      - name: 创建 AppImage
        run: |
          set -e
          echo "VERSION=$VERSION  dist/ABcode size=$(stat -c%s dist/ABcode 2>/dev/null || echo 0)"
          # 创建 AppDir 结构
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # 复制可执行文件
          cp dist/ABcode AppDir/usr/bin/

          # 创建 .desktop 文件
          cat > AppDir/usr/share/applications/abcode.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ABcode
          Exec=ABcode
          Icon=abcode
          Categories=Development;Utility;
          Comment=Local AI Agent Desktop App
          EOF

          # 复制图标
          cp build/icon.ico AppDir/usr/share/icons/hicolor/256x256/apps/abcode.png 2>/dev/null || \
          cp frontend/abcode_logo.svg AppDir/usr/share/icons/hicolor/256x256/apps/abcode.svg 2>/dev/null || true

          # AppRun 入口
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export PYTHONPATH="$HERE/usr/bin:$PYTHONPATH"
          exec "$HERE/usr/bin/ABcode" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/ABcode
          echo "AppDir 就绪: $(find AppDir -type f | wc -l) 个文件"

          # 下载 appimagetool（多源重试 + 大小校验）
          for url in \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"; do
            echo "尝试下载: $url"
            if wget -q -O appimagetool.AppImage "$url"; then
              sz=$(stat -c%s appimagetool.AppImage 2>/dev/null || echo 0)
              echo "下载完成: $sz bytes"
              if [ "$sz" -gt 1000000 ]; then break; fi
            fi
          done
          chmod +x appimagetool.AppImage
          [ -s appimagetool.AppImage ] || { echo "::error title=appimagetool::下载失败或文件为空"; exit 1; }

          # 生成 AppImage（GitHub Actions runner 无 FUSE，需 extract-and-run；失败再回退直接运行）
          if ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir "ABcode-linux-${VERSION#v}.AppImage"; then
            echo "extract-and-run 生成成功"
          else
            echo "extract-and-run 失败，回退直接运行..."
            ARCH=x86_64 ./appimagetool.AppImage AppDir "ABcode-linux-${VERSION#v}.AppImage"
          fi
          ls -lh ABcode-linux-*.AppImage
      - name: 创建源码包
        run: |
          mkdir -p dist_linux
          tar -czf dist_linux/ABcode-linux-source-${VERSION#v}.tar.gz \
            backend frontend macapp start.sh start.bat requirements.txt README.md docs CHANGELOG.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            ABcode-linux-*.AppImage
            dist_linux/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 安装 PyInstaller 和 NSIS
        run: |
          python -m pip install pyinstaller --quiet
          choco install nsis -y --no-progress
      - name: PyInstaller 打包 Windows 单文件 exe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION.TrimStart('v')
          
          Write-Host "Building Windows executable with PyInstaller..."
          python -m PyInstaller `
            --onefile `
            --name ABcode `
            --icon=build/icon.ico `
            --add-data "frontend;frontend" `
            --add-data "backend;backend" `
            --add-data "backend/requirements.txt;." `
            --hidden-import=uvicorn `
            --hidden-import=fastapi `
            --hidden-import=sqlite3 `
            --hidden-import=websockets `
            --hidden-import=httpx `
            --hidden-import=workflow_mod `
            backend/main.py
          
          if (-not (Test-Path "dist/ABcode.exe")) {
            Write-Error "PyInstaller failed - dist/ABcode.exe not found"
            exit 1
          }
          Write-Host "PyInstaller success: dist/ABcode.exe created"
          
          # 复制便携版 exe 到 dist 根目录用于上传
          Copy-Item dist/ABcode.exe dist/ABcode-${version}.exe
      - name: 创建 NSIS 安装包
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION.TrimStart('v')
          
          Write-Host "Creating NSIS installer..."
          
          # 准备安装器资源
          Copy-Item dist/ABcode.exe dist/ABcode.exe -Force
          Copy-Item build/start_windows.bat dist/ -Force
          Copy-Item build/icon.ico dist/ -Force
          New-Item -ItemType Directory -Force -Path dist/build | Out-Null
          Copy-Item build/icon.ico dist/build/ -Force
          Copy-Item build/banner.bmp dist/build/ -Force
          
          # 运行 NSIS（注意：NSIS 的宏定义参数须为 -DVERSION=...，/DVERSION 会被当作脚本文件名导致失败）
          $nsisPath = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $nsisPath) {
            $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          Write-Host "makensis: $nsisPath"
          # 输出到文件，失败时把末尾诊断写入 ::error:: annotation
          & $nsisPath "-DVERSION=$version" build/installer.nsi *>&1 | Tee-Object -FilePath makensis.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content makensis.log -ErrorAction SilentlyContinue | Select-Object -Last 30) -join " | "
            Write-Host "::error title=makensis exit=$code::$tail"
            exit 1
          }
          
          # 验证安装包
          $installer = Get-ChildItem dist/ABcode-Setup-*.exe -ErrorAction SilentlyContinue
          if ($installer) {
            Write-Host "Installer created: $($installer.FullName) ($($installer.Length) bytes)"
          } else {
            Write-Error "Installer not found"
            exit 1
          }
      - name: 创建 Windows 源码包
        shell: powershell
        run: |
          $version = $env:VERSION.TrimStart('v')
          Compress-Archive -Path "backend/*", "frontend/*", "macapp/*", "start.sh", "start.bat", "requirements.txt", "README.md", "docs/*", "CHANGELOG.md", "LICENSE" -DestinationPath "dist/ABcode-windows-source-${version}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/ABcode-Setup-*.exe
            dist/ABcode-*.exe
            dist/ABcode-windows-source-*.zip

  release:
    needs: [build-mac, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: 整理文件
        run: |
          find dist -type f -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.exe" | head -20
          ls -la dist/
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/ABcode-mac-*.dmg
            dist/**/ABcode-mac-*.zip
            dist/**/ABcode-linux-*.AppImage
            dist/**/ABcode-linux-source-*.tar.gz
            dist/**/ABcode-Setup-*.exe
            dist/**/ABcode-*.exe
            dist/**/ABcode-windows-source-*.zip
          generate_release_notes: true