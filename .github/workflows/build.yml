name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Mac .app
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
          cd dist && zip -r ABcode-mac-${{ github.ref_name }}.zip ABcode.app
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/ABcode-mac-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Linux 包
        run: |
          python -m pip install -r backend/requirements.txt
          mkdir -p dist_linux
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp scripts 2>/dev/null || \
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp
          tar -czf dist_linux/ABcode-linux-source-${{ github.ref_name }}.tar.gz \
            backend frontend macapp start.sh start.bat requirements.txt README.md docs CHANGELOG.md LICENSE 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist_linux/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 PyInstaller
        run: |
          python -m pip install pyinstaller --quiet
      - name: 构建 Windows 便携包
        shell: powershell
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          
          # Show Python and PyInstaller versions
          Write-Host "Python version: $(python --version)"
          Write-Host "PyInstaller version: $(pyinstaller --version)"
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Files in repo: $(Get-ChildItem | ForEach-Object { $_.Name })"
          
          # Check backend/main.py exists
          if (-not (Test-Path "backend/main.py")) {
            Write-Error "backend/main.py not found!"
            exit 1
          }
          Write-Host "backend/main.py found"
          
          # Build executable with PyInstaller (verbose)
          Write-Host "Building with PyInstaller..."
          python -m PyInstaller `
            --onefile `
            --name ABcode `
            --icon=build/icon.ico `
            --add-data "frontend;frontend" `
            --add-data "backend;backend" `
            --add-data "backend/requirements.txt;." `
            --hidden-import=uvicorn `
            --hidden-import=fastapi `
            --hidden-import=sqlite3 `
            --log-level=DEBUG `
            backend/main.py
          
          # Verify exe was created
          if (-not (Test-Path "dist/ABcode.exe")) {
            Write-Error "PyInstaller failed - dist/ABcode.exe not found"
            Write-Host "Contents of dist:"
            Get-ChildItem dist/ -Force | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
            exit 1
          }
          Write-Host "PyInstaller success: dist/ABcode.exe created ($((Get-Item dist/ABcode.exe).Length) bytes)"
          
          # Create portable package (zip)
          $version = $env:VERSION.TrimStart('v')
          $zipName = "ABcode-windows-${version}.zip"
          Write-Host "Creating portable package: $zipName"
          
          # Copy necessary files to a staging directory
          $staging = "dist_portable"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null
          
          Copy-Item dist/ABcode.exe $staging/
          Copy-Item -Recurse frontend $staging/
          Copy-Item -Recurse backend $staging/
          Copy-Item backend/requirements.txt $staging/
          Copy-Item build/icon.ico $staging/
          Copy-Item build/start_windows.bat $staging/
          
          # Create zip
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/$zipName" -Force
          Write-Host "Portable package created: dist/$zipName"
          
          # Verify
          $zipFile = Get-Item "dist/$zipName"
          Write-Host "Package size: $($zipFile.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/ABcode-windows-*.zip
          if-no-files-found: ignore

  release:
    needs: [build-mac, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          generate_release_notes: true