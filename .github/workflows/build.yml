name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Mac .app
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
          cd dist && zip -r ABcode-mac-${{ github.ref_name }}.zip ABcode.app
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/ABcode-mac-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Linux 包
        run: |
          python -m pip install -r backend/requirements.txt
          mkdir -p dist_linux
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp scripts 2>/dev/null || \
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp
          tar -czf dist_linux/ABcode-linux-source-${{ github.ref_name }}.tar.gz \
            backend frontend macapp start.sh start.bat requirements.txt README.md docs CHANGELOG.md LICENSE 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist_linux/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Windows 源码包
        shell: powershell
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION.TrimStart('v')
          
          Write-Host "Creating Windows packages..."
          Write-Host "Current directory: $(Get-Location)"
          
          # Create dist directory
          New-Item -ItemType Directory -Force -Path dist_windows | Out-Null
          
          # Check what directories/files exist
          $dirsToCheck = @("backend", "frontend", "macapp", "scripts", "docs", "build")
          foreach ($d in $dirsToCheck) {
            if (Test-Path $d) {
              Write-Host "Directory exists: $d"
            } else {
              Write-Host "Directory NOT found: $d"
            }
          }
          
          $filesToCheck = @("start.sh", "start.bat", "requirements.txt", "README.md", "CHANGELOG.md", "LICENSE")
          foreach ($f in $filesToCheck) {
            if (Test-Path $f) {
              Write-Host "File exists: $f"
            } else {
              Write-Host "File NOT found: $f"
            }
          }
          
          # Binary package - use explicit file list
          $binaryName = "ABcode-windows-${version}.zip"
          Write-Host "Creating binary package: $binaryName"
          
          # Create a temp directory structure
          $tempDir = "dist_windows_temp_binary"
          if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
          New-Item -ItemType Directory -Path $tempDir | Out-Null
          
          if (Test-Path "backend") { Copy-Item -Recurse backend "$tempDir/" }
          if (Test-Path "frontend") { Copy-Item -Recurse frontend "$tempDir/" }
          if (Test-Path "macapp") { Copy-Item -Recurse macapp "$tempDir/" }
          if (Test-Path "scripts") { Copy-Item -Recurse scripts "$tempDir/" }
          
          Compress-Archive -Path "$tempDir/*" -DestinationPath "dist_windows/$binaryName" -Force
          Remove-Item $tempDir -Recurse -Force
          
          # Source package
          $sourceName = "ABcode-windows-source-${version}.zip"
          Write-Host "Creating source package: $sourceName"
          
          $tempDir2 = "dist_windows_temp_source"
          if (Test-Path $tempDir2) { Remove-Item $tempDir2 -Recurse -Force }
          New-Item -ItemType Directory -Path $tempDir2 | Out-Null
          
          if (Test-Path "backend") { Copy-Item -Recurse backend "$tempDir2/" }
          if (Test-Path "frontend") { Copy-Item -Recurse frontend "$tempDir2/" }
          if (Test-Path "macapp") { Copy-Item -Recurse macapp "$tempDir2/" }
          if (Test-Path "start.sh") { Copy-Item start.sh "$tempDir2/" }
          if (Test-Path "start.bat") { Copy-Item start.bat "$tempDir2/" }
          if (Test-Path "requirements.txt") { Copy-Item requirements.txt "$tempDir2/" }
          if (Test-Path "README.md") { Copy-Item README.md "$tempDir2/" }
          if (Test-Path "docs") { Copy-Item -Recurse docs "$tempDir2/" }
          if (Test-Path "CHANGELOG.md") { Copy-Item CHANGELOG.md "$tempDir2/" }
          if (Test-Path "LICENSE") { Copy-Item LICENSE "$tempDir2/" }
          
          Compress-Archive -Path "$tempDir2/*" -DestinationPath "dist_windows/$sourceName" -Force
          Remove-Item $tempDir2 -Recurse -Force
          
          # Verify
          Get-ChildItem dist_windows/ | ForEach-Object { 
            Write-Host "  $($_.Name) ($($_.Length) bytes)" 
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist_windows/*.zip
          if-no-files-found: ignore

  release:
    needs: [build-mac, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          generate_release_notes: true