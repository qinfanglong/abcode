name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Mac .app
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
          cd dist && zip -r ABcode-mac-${{ github.ref_name }}.zip ABcode.app
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/ABcode-mac-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Linux 包
        run: |
          python -m pip install -r backend/requirements.txt
          mkdir -p dist_linux
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp scripts 2>/dev/null || \
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp
          tar -czf dist_linux/ABcode-linux-source-${{ github.ref_name }}.tar.gz \
            backend frontend macapp start.sh start.bat requirements.txt README.md docs CHANGELOG.md LICENSE 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist_linux/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Windows 源码包
        shell: powershell
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION.TrimStart('v')
          
          Write-Host "Creating Windows source packages..."
          
          # Create dist directory
          New-Item -ItemType Directory -Force -Path dist_windows | Out-Null
          
          # Binary package (just the app files)
          $binaryName = "ABcode-windows-${version}.tar.gz"
          Write-Host "Creating binary package: $binaryName"
          tar -czf "dist_windows/$binaryName" backend frontend macapp scripts
          
          # Source package (with docs, scripts, etc.)
          $sourceName = "ABcode-windows-source-${version}.tar.gz"
          Write-Host "Creating source package: $sourceName"
          tar -czf "dist_windows/$sourceName" `
            backend frontend macapp start.sh start.bat requirements.txt README.md docs CHANGELOG.md LICENSE
          
          # Verify
          Get-ChildItem dist_windows/ | ForEach-Object { 
            Write-Host "  $($_.Name) ($($_.Length) bytes)" 
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist_windows/*.tar.gz
          if-no-files-found: ignore

  release:
    needs: [build-mac, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          generate_release_notes: true