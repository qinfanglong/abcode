name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 构建 Mac .app + DMG
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/ABcode-mac-*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-zip
          path: dist/ABcode-mac-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf desktop-file-utils \
            fuse libfuse2 squashfs-tools
      - name: 创建虚拟环境并安装依赖
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r backend/requirements.txt
          pip install pyinstaller
      - name: PyInstaller 打包 Linux
        run: |
          source .venv/bin/activate
          pyinstaller \
            --onefile \
            --name ABcode \
            --add-data "frontend:frontend" \
            --add-data "backend:backend" \
            --add-data "backend/requirements.txt:." \
            --hidden-import=uvicorn \
            --hidden-import=fastapi \
            --hidden-import=sqlite3 \
            --hidden-import=websockets \
            --hidden-import=httpx \
            --hidden-import=workflow_mod \
            backend/main.py
      - name: 创建 AppImage
        run: |
          set -e
          echo "VERSION=$VERSION  dist/ABcode size=$(stat -c%s dist/ABcode 2>/dev/null || echo 0)"
          # 创建 AppDir 结构
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # 复制可执行文件
          cp dist/ABcode AppDir/usr/bin/

          # 创建 .desktop 文件（用 printf 逐行写，避免 heredoc 在 YAML 块中的转写问题）
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=ABcode' \
            'Exec=ABcode' \
            'Icon=abcode' \
            'Categories=Development;Utility;' \
            'Comment=Local AI Agent Desktop App' \
            > AppDir/usr/share/applications/abcode.desktop
          echo "desktop 文件内容："
          cat AppDir/usr/share/applications/abcode.desktop
          ls -la AppDir/usr/share/applications/

          # 复制图标（同时放到 usr/share/icons 与 AppDir 根目录，appimagetool 要求根目录有 Icon= 对应文件）
          if [ -f build/icon.ico ]; then
            cp build/icon.ico AppDir/usr/share/icons/hicolor/256x256/apps/abcode.png 2>/dev/null || true
          fi
          cp frontend/abcode_logo.svg AppDir/usr/share/icons/hicolor/256x256/apps/abcode.svg 2>/dev/null || true
          cp frontend/abcode_logo.svg AppDir/abcode.svg 2>/dev/null || true
          # 根目录必须存在与 Icon= 同名的图标（appimagetool 检查 $APPDIR/abcode.svg/.png/.xpm）
          if [ ! -f AppDir/abcode.svg ] && [ ! -f AppDir/abcode.png ]; then
            echo "::error title=icon::AppDir 根目录缺少 Icon=abcode 图标文件"
            exit 1
          fi

          # AppRun 入口（printf 写入，避免 heredoc 问题）
          printf '%s\n' \
            '#!/bin/bash' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'export PYTHONPATH="$HERE/usr/bin:$PYTHONPATH"' \
            'exec "$HERE/usr/bin/ABcode" "$@"' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/ABcode

          # appimagetool 只会在 AppDir 根目录（非递归）查找 *.desktop，必须复制一份到根目录
          cp AppDir/usr/share/applications/abcode.desktop AppDir/abcode.desktop
          echo "root desktop: $(ls -la AppDir/abcode.desktop)"
          echo "AppDir 就绪: $(find AppDir -type f | wc -l) 个文件"

          # 下载 appimagetool（多源重试 + 大小校验）
          for url in \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"; do
            echo "尝试下载: $url"
            if wget -q -O appimagetool.AppImage "$url"; then
              sz=$(stat -c%s appimagetool.AppImage 2>/dev/null || echo 0)
              echo "下载完成: $sz bytes"
              if [ "$sz" -gt 1000000 ]; then break; fi
            fi
          done
          chmod +x appimagetool.AppImage
          [ -s appimagetool.AppImage ] || { echo "::error title=appimagetool::下载失败或文件为空"; exit 1; }

          # 生成 AppImage（GitHub Actions runner 无 FUSE，需 extract-and-run；失败再回退直接运行）
          set +e
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir "ABcode-linux-${VERSION#v}.AppImage" 2>appimg_err.txt
          rc1=$?
          if [ $rc1 -eq 0 ]; then
            echo "extract-and-run 生成成功"
          else
            echo "extract-and-run 失败(rc=$rc1)，回退直接运行..."
            ARCH=x86_64 ./appimagetool.AppImage AppDir "ABcode-linux-${VERSION#v}.AppImage" 2>>appimg_err.txt
          fi
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error title=AppImage-rc$rc::$(tail -c 700 appimg_err.txt | tr '\n' ' ')"
            exit 1
          fi
          ls -lh ABcode-linux-*.AppImage
      - name: 创建源码包
        run: |
          mkdir -p dist_linux
          tar -czf dist_linux/ABcode-linux-source-${VERSION#v}.tar.gz \
            backend frontend macapp start.sh start.bat README.md docs CHANGELOG.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            ABcode-linux-*.AppImage
            dist_linux/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 安装 PyInstaller 和 NSIS
        run: |
          python -m pip install pyinstaller --quiet
          # 下载便携版 NSIS 3.09（固定路径，避免 choco 安装路径/版本差异）
          # 使用 curl.exe（Windows 自带）+ 多镜像重试，Invoke-WebRequest 在 runner 上易失败
          $mirrors = @(
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.09/nsis-3.09.zip",
            "https://master.dl.sourceforge.net/project/nsis/NSIS%203/3.09/nsis-3.09.zip?viasf=1",
            "https://kent.dl.sourceforge.net/project/nsis/NSIS%203/3.09/nsis-3.09.zip?viasf=1"
          )
          $downloaded = $false
          foreach ($url in $mirrors) {
            Write-Host "尝试下载 NSIS: $url"
            curl.exe -L --retry 3 --connect-timeout 30 -o nsis.zip $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path nsis.zip) -and ((Get-Item nsis.zip).Length -gt 1000000)) {
              $downloaded = $true
              Write-Host "下载成功: $((Get-Item nsis.zip).Length) bytes"
              break
            }
          }
          if (-not $downloaded) {
            Write-Error "NSIS 便携版下载失败（所有镜像均失败）"
            exit 1
          }
          # 校验 ZIP 头（PK..）防止下载到 HTML
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path nsis.zip))[0..1]
          if (-not ($bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B)) {
            Write-Error "nsis.zip 不是有效的 ZIP 文件"
            exit 1
          }
          Expand-Archive nsis.zip -DestinationPath . -Force
          Get-ChildItem nsis-* | Select-Object Name
          if (-not (Test-Path ".\nsis-3.09\makensis.exe")) {
            Write-Error "NSIS 便携版缺少 makensis.exe"
            exit 1
          }
      - name: PyInstaller 打包 Windows 单文件 exe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION.TrimStart('v')
          
          Write-Host "Building Windows executable with PyInstaller..."
          python -m PyInstaller `
            --onefile `
            --name ABcode `
            --icon=build/icon.ico `
            --add-data "frontend;frontend" `
            --add-data "backend;backend" `
            --add-data "backend/requirements.txt;." `
            --hidden-import=uvicorn `
            --hidden-import=fastapi `
            --hidden-import=sqlite3 `
            --hidden-import=websockets `
            --hidden-import=httpx `
            --hidden-import=workflow_mod `
            backend/main.py
          
          if (-not (Test-Path "dist/ABcode.exe")) {
            Write-Error "PyInstaller failed - dist/ABcode.exe not found"
            exit 1
          }
          Write-Host "PyInstaller success: dist/ABcode.exe created"
          
          # 复制便携版 exe 到 dist 根目录用于上传
          Copy-Item dist/ABcode.exe dist/ABcode-${version}.exe
      - name: 创建 NSIS 安装包
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION.TrimStart('v')
          
          Write-Host "Creating NSIS installer..."
          
          # 准备安装器资源（ABcode.exe 已在 dist 下，无需自复制）
          Copy-Item build/start_windows.bat dist/ -Force
          Copy-Item build/icon.ico dist/ -Force
          New-Item -ItemType Directory -Force -Path dist/build | Out-Null
          Copy-Item build/icon.ico dist/build/ -Force
          Copy-Item build/banner.bmp dist/build/ -Force
          
          # 运行 NSIS（注意：NSIS 的宏定义参数须为 -DVERSION=...，/DVERSION 会被当作脚本文件名导致失败）
          # ROOT 传仓库绝对路径，避免 NSIS 按脚本所在目录(build/)解析相对路径的问题
          $nsisPath = ".\nsis-3.09\makensis.exe"
          # ROOT 必须保持反斜杠格式（D:\a\abcode\abcode）：
          # NSIS File 指令只把 X:\ 形式识别为绝对路径，正斜杠/混合分隔符会报 no files found
          $rootPath = $env:GITHUB_WORKSPACE
          Write-Host "makensis: $nsisPath  ROOT=$rootPath"
          # 诊断：确认安装器资源确实存在于仓库根
          foreach ($f in @("build\banner.bmp", "build\icon.ico", "LICENSE", "dist\ABcode.exe", "build\start_windows.bat")) {
            Write-Host "check $f => $(Test-Path (Join-Path $rootPath $f))"
          }
          Write-Host "banner.bmp size: $((Get-Item (Join-Path $rootPath 'build\banner.bmp') -ErrorAction SilentlyContinue).Length)"
          # 完整捕获 makensis 输出；失败时把末尾诊断写入 ::error:: annotation（可匿名从 run 页/API 读取）
          $output = & $nsisPath "-DVERSION=$version" "-DROOT=$rootPath" build/installer.nsi 2>&1
          $code = $LASTEXITCODE
          Write-Host ($output -join "`n")
          if ($code -ne 0) {
            $tail = ($output | Select-Object -Last 20) -join " || "
            Write-Host "::error title=makensis-exit$code::$tail"
            exit 1
          }
          
          # 验证安装包
          $installer = Get-ChildItem dist/ABcode-Setup-*.exe -ErrorAction SilentlyContinue
          if ($installer) {
            Write-Host "Installer created: $($installer.FullName) ($($installer.Length) bytes)"
          } else {
            Write-Error "Installer not found"
            exit 1
          }
      - name: 创建 Windows 源码包
        shell: powershell
        run: |
          $version = $env:VERSION.TrimStart('v')
          Compress-Archive -Path "backend/*", "frontend/*", "macapp/*", "start.sh", "start.bat", "README.md", "docs/*", "CHANGELOG.md", "LICENSE" -DestinationPath "dist/ABcode-windows-source-${version}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/ABcode-Setup-*.exe
            dist/ABcode-*.exe
            dist/ABcode-windows-source-*.zip

  release:
    needs: [build-mac, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: 整理文件
        run: |
          find dist -type f -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.exe" | head -20
          ls -la dist/
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/ABcode-mac-*.dmg
            dist/**/ABcode-mac-*.zip
            dist/**/ABcode-linux-*.AppImage
            dist/**/ABcode-linux-source-*.tar.gz
            dist/**/ABcode-Setup-*.exe
            dist/**/ABcode-*.exe
            dist/**/ABcode-windows-source-*.zip
          generate_release_notes: true