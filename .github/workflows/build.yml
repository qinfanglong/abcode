name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Mac .app
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
          cd dist && zip -r ABcode-mac-${{ github.ref_name }}.zip ABcode.app
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/ABcode-mac-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Linux 包
        run: |
          python -m pip install -r backend/requirements.txt
          mkdir -p dist_linux
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp scripts 2>/dev/null || \
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp
          tar -czf dist_linux/ABcode-linux-source-${{ github.ref_name }}.tar.gz \
            backend frontend macapp start.sh start.bat requirements.txt README.md docs CHANGELOG.md LICENSE 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist_linux/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 PyInstaller 和 NSIS
        run: |
          python -m pip install pyinstaller --quiet
          choco install nsis -y --no-progress
      - name: 构建 Windows .exe 和安装包
        shell: bash
        run: |
          # Build executable with PyInstaller
          python -m PyInstaller \
            --onefile \
            --name ABcode \
            --icon=build/icon.ico \
            --add-data "frontend;frontend" \
            --add-data "backend;backend" \
            --add-data "backend/requirements.txt;." \
            --hidden-import=uvicorn \
            --hidden-import=fastapi \
            --hidden-import=sqlite3 \
            backend/main.py

          # Copy start script and resources
          cp build/start_windows.bat dist/
          cp build/icon.ico dist/
          mkdir -p dist/build
          cp build/icon.ico dist/build/
          cp build/banner.bmp dist/build/

          # Create installer with NSIS
          /c/Program\ Files\ \(x86\)/NSIS/makensis.exe build/installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/ABcode-Setup-*.exe
          if-no-files-found: ignore

  release:
    needs: [build-mac, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          generate_release_notes: true