name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Mac .app
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
          cd dist && zip -r ABcode-mac-${{ github.ref_name }}.zip ABcode.app
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/ABcode-mac-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Linux 包
        run: |
          python -m pip install -r backend/requirements.txt
          mkdir -p dist_linux
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp scripts 2>/dev/null || \
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp
          tar -czf dist_linux/ABcode-linux-source-${{ github.ref_name }}.tar.gz \
            backend frontend macapp start.sh start.bat requirements.txt README.md docs CHANGELOG.md LICENSE 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist_linux/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Windows 源码包
        shell: powershell
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:VERSION.TrimStart('v')
          
          Write-Host "Checking available tools..."
          Write-Host "7z: $(Get-Command 7z -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "Current directory: $(Get-Location)"
          
          # Create dist directory
          New-Item -ItemType Directory -Force -Path dist_windows | Out-Null
          
          # Simple approach: zip the whole repo (excluding .git)
          $binaryName = "ABcode-windows-${version}.zip"
          Write-Host "Creating package: $binaryName"
          
          # Use 7z if available
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            Write-Host "Using 7-Zip"
            & 7z a -tzip "dist_windows/$binaryName" . -xr!.git -xr!dist_windows -xr!__pycache__ -xr!.venv -xr!node_modules
          } else {
            Write-Host "Using Compress-Archive"
            # Create a temp directory with files to zip
            $tempDir = "dist_windows_temp"
            if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
            New-Item -ItemType Directory -Path $tempDir | Out-Null
            
            # Copy all files except exclusions
            Get-ChildItem -File -Recurse | Where-Object { 
              $_.FullName -notmatch '\\.git\\' -and 
              $_.FullName -notmatch '\\dist_windows\\' -and
              $_.FullName -notmatch '__pycache__' -and
              $_.FullName -notmatch '\\.venv\\' -and
              $_.FullName -notmatch 'node_modules'
            } | Copy-Item -Destination $tempDir -Recurse -Force
            
            Compress-Archive -Path "$tempDir/*" -DestinationPath "dist_windows/$binaryName" -Force
            Remove-Item $tempDir -Recurse -Force
          }
          
          # Verify
          $zipFile = Get-Item "dist_windows/$binaryName"
          Write-Host "Package created: $($zipFile.Name) ($($zipFile.Length) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist_windows/*.zip
          if-no-files-found: ignore

  release:
    needs: [build-mac, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          generate_release_notes: true