name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Mac .app
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
          cd dist && zip -r ABcode-mac-${{ github.ref_name }}.zip ABcode.app
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/ABcode-mac-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 Linux 包
        run: |
          python -m pip install -r backend/requirements.txt
          mkdir -p dist_linux
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp scripts 2>/dev/null || \
          tar -czf dist_linux/ABcode-linux-${{ github.ref_name }}.tar.gz \
            backend frontend macapp
          tar -czf dist_linux/ABcode-linux-source-${{ github.ref_name }}.tar.gz \
            backend frontend macapp start.sh start.bat requirements.txt README.md docs CHANGELOG.md LICENSE 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist_linux/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 PyInstaller 和 NSIS
        run: |
          python -m pip install pyinstaller --quiet
          choco install nsis -y --no-progress
      - name: 构建 Windows .exe 和安装包
        shell: powershell
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          
          # Show NSIS location
          Write-Host "Checking NSIS..."
          $nsisPath = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($nsisPath) {
            Write-Host "NSIS found at: $($nsisPath.Source)"
          } else {
            Write-Host "NSIS not in PATH, checking common locations..."
            $possiblePaths = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe",
              "C:\nsis\makensis.exe"
            )
            foreach ($p in $possiblePaths) {
              if (Test-Path $p) {
                Write-Host "Found NSIS at: $p"
                $nsisPath = $p
                break
              }
            }
          }
          
          if (-not $nsisPath) {
            Write-Error "NSIS not found!"
            exit 1
          }
          
          # Build executable with PyInstaller
          Write-Host "Building with PyInstaller..."
          python -m PyInstaller `
            --onefile `
            --name ABcode `
            --icon=build/icon.ico `
            --add-data "frontend;frontend" `
            --add-data "backend;backend" `
            --add-data "backend/requirements.txt;." `
            --hidden-import=uvicorn `
            --hidden-import=fastapi `
            --hidden-import=sqlite3 `
            backend/main.py
          
          # Verify exe was created
          if (-not (Test-Path "dist/ABcode.exe")) {
            Write-Error "PyInstaller failed - dist/ABcode.exe not found"
            exit 1
          }
          Write-Host "PyInstaller success: dist/ABcode.exe created"
          
          # Copy resources for installer
          Write-Host "Copying installer resources..."
          Copy-Item build/start_windows.bat dist/ -Force
          Copy-Item build/icon.ico dist/ -Force
          New-Item -ItemType Directory -Force -Path dist/build | Out-Null
          Copy-Item build/icon.ico dist/build/ -Force
          Copy-Item build/banner.bmp dist/build/ -Force
          
          # Create installer with NSIS (pass version from tag)
          $version = $env:VERSION.TrimStart('v')
          Write-Host "Creating installer with NSIS version: $version"
          & $nsisPath /DVERSION="$version" build/installer.nsi
          
          # Verify installer was created
          $installer = Get-ChildItem dist/ABcode-Setup-*.exe -ErrorAction SilentlyContinue
          if ($installer) {
            Write-Host "Installer created: $($installer.FullName) ($($installer.Length) bytes)"
          } else {
            Write-Error "Installer not found in dist/"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/ABcode-Setup-*.exe
          if-no-files-found: ignore

  release:
    needs: [build-mac, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          generate_release_notes: true